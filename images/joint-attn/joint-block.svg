24" stroke="#c3cbce" stroke-width="1" fill="none"/><text x="325" y="146.88" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b767b" text-anchor="middle" font-weight="400">W_o  B</text><rect x="12" y="164" width="186" height="24" stroke="#c3cbce" stroke-width="1" fill="none"/><text x="105" y="178.88" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b767b" text-anchor="middle" font-weight="400">SwiGLU  A</text><rect x="232" y="164" width="186" height="24" stroke="#c3cbce" stroke-width="1" fill="none"/><text x="325" y="178.88" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b767b" text-anchor="middle" font-weight="400">SwiGLU  B</text><rect x="12" y="94" width="406" height="30" stroke="#2e83c4" stroke-width="1" fill="none"/><text x="24" y="104" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2e83c4" text-anchor="start" font-weight="600">concat K / V  →  一个 softmax  →  按流切回</text><text x="24" y="116" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8f9a9f" text-anchor="start" font-weight="400">KV 池 = 850 + 50；只有这一步是「联合」的</text><line x1="105" y1="54" x2="105" y2="62" stroke="#8f9a9f" stroke-width="1"/><path d="M102.4,59.4 L105,62 L107.6,59.4" fill="none" stroke="#8f9a9f" stroke-width="1"/><line x1="325" y1="54" x2="325" y2="62" stroke="#8f9a9f" stroke-width="1"/><path d="M322.4,59.4 L325,62 L327.6,59.4" fill="none" stroke="#8f9a9f" stroke-width="1"/><line x1="105" y1="124" x2="105" y2="132" stroke="#8f9a9f" stroke-width="1"/><path d="M102.4,129.4 L105,132 L107.6,129.4" fill="none" stroke="#8f9a9f" stroke-width="1"/><line x1="325" y1="124" x2="325" y2="132" stroke="#8f9a9f" stroke-width="1"/><path d="M322.4,129.4 L325,132 L327.6,129.4" fill="none" stroke="#8f9a9f" stroke-width="1"/><line x1="105" y1="156" x2="105" y2="164" stroke="#8f9a9f" stroke-width="1"/><path d="M102.4,161.4 L105,164 L107.6,161.4" fill="none" stroke="#8f9a9f" stroke-width="1"/><line x1="325" y1="156" x2="325" y2="164" stroke="#8f9a9f" stroke-width="1"/><path d="M322.4,161.4 L325,164 L327.6,161.4" fill="none" stroke="#8f9a9f" stroke-width="1"/><line x1="105" y1="86" x2="105" y2="94" stroke="#8f9a9f" stroke-width="1"/><path d="M102.4,91.4 L105,94 L107.6,91.4" fill="none" stroke="#8f9a9f" stroke-width="1"/><line x1="325" y1="86" x2="325" y2="94" stroke="#8f9a9f" stroke-width="1"/><path d="M322.4,91.4 L325,94 L327.6,91.4" fill="none" stroke="#8f9a9f" stroke-width="1"/><line x1="105" y1="124" x2="105" y2="132" stroke="#8f9a9f" stroke-width="1"/><path d="M102.4,129.4 L105,132 L107.6,129.4" fill="none" stroke="#8f9a9f" stroke-width="1"/><line x1="325" y1="124" x2="325" y2="132" stroke="#8f9a9f" stroke-width="1"/><path d="M322.4,129.4 L325,132 L327.6,129.4" fill="none" stroke="#8f9a9f" stroke-width="1"/><line x1="444" y1="12" x2="444" y2="200" stroke="#c3cbce" stroke-width="0.8"/><text x="456" y="24" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#6b767b" text-anchor="start" font-weight="600">分流：两套权重</text><text x="456" y="38" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8f9a9f" text-anchor="start" font-weight="400">norm · QKV · O · FFN · 词表</text><text x="456" y="50" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8f9a9f" text-anchor="start" font-weight="400">参数 ≈ 2 × 单流，激活 ≈ 1 × 单流</text><text x="456" y="74" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#6b767b" text-anchor="start" font-weight="600">共享：一次计算</text><text x="456" y="88" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8f9a9f" text-anchor="start" font-weight="400">KV 池 · softmax 分母 · 位置轴</text><text x="456" y="100" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8f9a9f" text-anchor="start" font-weight="400">token 只过自己那一套，却能被对方读到</text><text x="456" y="124" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#6b767b" text-anchor="start" font-weight="600">特例</text><text x="456" y="138" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8f9a9f" text-anchor="start" font-weight="400">单流 DiT = 把两套换成一套</text><text x="456" y="150" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8f9a9f" text-anchor="start" font-weight="400">SD3 §4 原话，联合注意力不变</text><line x1="444" y1="166" x2="708" y2="166" stroke="#c3cbce" stroke-width="0.8"/><text x="456" y="182" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#6b767b" text-anchor="start" font-weight="400">π0.5 与 MM-DiT 都落在这张接线图上</text><text x="456" y="194" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8f9a9f" text-anchor="start" font-weight="400">差别只在 mask 与位置轴</text></svg>
