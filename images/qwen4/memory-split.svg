<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 208" width="720" height="208" role="img"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#828e94"/></marker></defs><text x="0" y="14" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#828e94" text-anchor="start" font-weight="400" opacity="1">参数与运行状态的内存分布</text><rect x="0" y="28" width="720" height="72" fill="none" stroke="#b6bec2" stroke-width="1"/><text x="12" y="46" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="10" fill="#828e94" text-anchor="start" font-weight="400" opacity="1">GPU · HBM</text><text x="24" y="70" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#748086" text-anchor="start" font-weight="400" opacity="1">125B 主权重 —— 每 token 只激活 6B</text><text x="24" y="88" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#748086" text-anchor="start" font-weight="400" opacity="1">KV cache 24 KB/token —— 只有 12 个 QSA 层有</text><text x="436" y="70" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#748086" text-anchor="start" font-weight="400" opacity="1">GDN 状态 113 MB</text><text x="436" y="88" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#828e94" text-anchor="start" font-weight="400" opacity="1">与序列长度无关</text><line x1="360" y1="102" x2="360" y2="138" stroke="#828e94" stroke-width="1" marker-end="url(#ar)" opacity="1"/><text x="374" y="124" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#828e94" text-anchor="start" font-weight="400" opacity="1">PCIe · 异步预取 · 每 token 16 行 × 2560 维 ≈ 80 KB（bf16）</text><rect x="0" y="142" width="720" height="62" fill="none" stroke="#b6bec2" stroke-width="1"/><text x="12" y="160" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="10" fill="#828e94" text-anchor="start" font-weight="400" opacity="1">CPU · DDR5</text><text x="24" y="184" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#748086" text-anchor="start" font-weight="400" opacity="1">N-gram 表 51B —— INT8 约 51 GB / INT4 约 26 GB</text><text x="436" y="184" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#828e94" text-anchor="start" font-weight="400" opacity="1">确定性寻址，不永久占显存</text></svg>
